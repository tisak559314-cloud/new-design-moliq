<!doctype html>
<!-- Картинка превью ссылок (assets/og.png, 1200×630): Telegram, соцсети, мессенджеры.
     Перерисовать: запустить python3 serve.py и снять снимок Chrome без окна:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630
       --virtual-time-budget=8000 --screenshot=assets/og.png http://localhost:4321/tools/og.html -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root { --bg: #f2f4f7; --ink: #0a0b10; --ink-2: #454b58; --lime: #c8f24a; --blue: #2d5bff; --line: #e2e6ec; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); font-family: "Onest", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .page { display: grid; grid-template-columns: 1fr 400px; gap: 48px; padding: 64px 64px 64px 72px; height: 100%; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; }
  .brand svg { width: 52px; height: 42px; }
  h1 { margin-top: 56px; font-size: 62px; line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; text-wrap: balance; }
  h1 em { font-style: normal; background: var(--lime); border-radius: 14px; padding: 0 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 40px; }
  .chips span { background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 700; color: var(--ink-2); }
  .art { position: relative; background: var(--ink); border-radius: 32px; overflow: hidden; }
  .art .mark { position: absolute; right: -40px; bottom: -30px; width: 380px; opacity: .12; }
  .card { position: absolute; left: 32px; right: 32px; background: #fff; border-radius: 22px; padding: 22px 24px; }
  .card small { display: block; font-size: 18px; font-weight: 700; color: var(--ink-2); }
  .card b { display: block; margin-top: 6px; white-space: nowrap; font-size: 31px; font-weight: 800; letter-spacing: -0.03em; }
  .c1 { top: 40px; }
  .c2 { top: 168px; background: var(--lime); }
  .c3 { top: 296px; }
  .lang { position: absolute; left: 32px; bottom: 36px; color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .08em; opacity: .9; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); margin-right: 10px; vertical-align: 2px; }
</style>
</head>
<body>
  <div class="page">
    <div>
      <div class="brand"><svg viewBox="40 42 780 622" aria-hidden="true"><use href="#m"/></svg>Moliq</div>
      <h1>Кредиты, вклады и&nbsp;курсы <em>всех банков</em> Узбекистана</h1>
      <div class="chips"><span>Кредиты</span><span>Вклады</span><span>Карты</span><span>Курсы валют</span><span>Золото ЦБ</span><span>Банкоматы</span></div>
    </div>
    <div class="art">
      <svg class="mark" viewBox="40 42 780 622" aria-hidden="true"><use href="#m" fill="#fff"/></svg>
      <div class="card c1"><small>Платёж и переплата</small><b>в каждом банке</b></div>
      <div class="card c2"><small>Где выгоднее купить</small><b>доллар и золото</b></div>
      <div class="card c3"><small>Банкомат рядом</small><b>Humo · Uzcard · Visa</b></div>
      <div class="lang"><span class="dot"></span>RU · UZ · EN</div>
    </div>
  </div>
  <svg width="0" height="0" style="position:absolute"><defs><g id="m"></g></defs></svg>
  <script>
    // знак берём из настоящего логотипа сайта, чтобы не держать вторую копию
    fetch("../assets/moliq-logo.svg").then((r) => r.text()).then((s) => {
      const d = new DOMParser().parseFromString(s, "image/svg+xml");
      document.getElementById("m").innerHTML = [...d.documentElement.children].map((n) => n.outerHTML).join("");
    });
  </script>
</body>
</html>
